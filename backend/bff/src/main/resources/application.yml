spring:
  application:
    name: apexpredict-bff
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/apexpredict}
    username: apexpredict
    password: ${APP_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: 8443
  # El BFF recibe TLS real de Nginx y no confia en cabeceras reenviadas del cliente.
  forward-headers-strategy: none
  ssl:
    enabled: true
    key-store: ${TLS_KEY_STORE:file:/certs/local.p12}
    key-store-type: PKCS12
    key-store-password: ${CERT_PASSWORD}
    key-alias: dacs2026.local
    enabled-protocols: TLSv1.2,TLSv1.3
  error:
    include-message: never
    include-stacktrace: never
apexpredict:
  security:
    issuer: https://dacs2026.local/auth/realms/apexpredict
    jwk-set-uri: https://dacs2026.local/auth/realms/apexpredict/protocol/openid-connect/certs
    audience: apexpredict-bff
    cors-origins: http://localhost:4200,https://localhost:4200,https://dacs2026.local
  jolpica:
    base-url: https://api.jolpi.ca/ergast/f1
