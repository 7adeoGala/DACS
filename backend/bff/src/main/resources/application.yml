spring:
  application:
    name: apexpredict-bff
server:
  port: ${PORT:8443}
  servlet:
    context-path: /bff
  forward-headers-strategy: none
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
    key-store: ${TLS_KEY_STORE:file:/certs/local.p12}
    key-store-type: PKCS12
    key-store-password: ${CERT_PASSWORD}
    key-alias: dacs2026.local
    enabled-protocols: TLSv1.2,TLSv1.3
  error:
    include-message: never
    include-stacktrace: never
feign:
  client:
    config:
      default:
        connectTimeout: 45000
        readTimeout: 60000
        loggerLevel: basic
      domainClient:
        url: ${DOMAIN_SERVICE_URL:https://dacs-pmkx.onrender.com/backend}
      conectorClient:
        url: ${F1_CONNECTOR_URL:https://dacs-1-v4ik.onrender.com/conector}
apexpredict:
  security:
    issuer: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_ISSUER:https://dacs-3-dswy.onrender.com/auth/realms/apexpredict}}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://dacs-3-dswy.onrender.com/auth/realms/apexpredict/protocol/openid-connect/certs}
    audience: apexpredict-bff
    cors-origins: ${CORS_ORIGINS:https://dacs-nine.vercel.app,http://localhost:4200,https://localhost:4200,https://dacs2026.local}
