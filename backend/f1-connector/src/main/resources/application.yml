spring:
  application:
    name: apexpredict-f1-connector
server:
  port: ${PORT:9002}
  servlet:
    context-path: /conector
  error:
    include-message: never
    include-stacktrace: never
jolpica:
  api:
    url: ${JOLPICA_API_URL:https://api.jolpi.ca/ergast/f1}
    min-interval-ms: ${JOLPICA_MIN_INTERVAL_MS:320}
    rate-limit-backoff-ms: ${JOLPICA_RATE_LIMIT_BACKOFF_MS:1200}
openf1:
  api:
    url: ${OPENF1_API_URL:https://api.openf1.org/v1}
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: basic
apexpredict:
  circuit-breaker:
    failure-threshold: ${F1_CB_FAILURE_THRESHOLD:3}
    open-duration-seconds: ${F1_CB_OPEN_DURATION_SECONDS:30}
