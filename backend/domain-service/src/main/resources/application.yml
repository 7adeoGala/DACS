spring:
  application:
    name: apexpredict-domain-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/apexpredict}
    username: ${DB_USER:apexpredict}
    password: ${APP_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:9003}
  servlet:
    context-path: /backend
  error:
    include-message: never
    include-stacktrace: never
apexpredict:
  security:
    issuer: ${KEYCLOAK_ISSUER:https://dacs-3-dswy.onrender.com/auth/realms/apexpredict}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://dacs-3-dswy.onrender.com/auth/realms/apexpredict/protocol/openid-connect/certs}
    audience: apexpredict-backend
