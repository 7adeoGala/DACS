spring:
  application:
    name: apexpredict-domain-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/apexpredict}
    username: ${DB_USER:apexpredict}
    password: ${APP_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    out-of-order: true
server:
  port: ${PORT:9003}
  servlet:
    context-path: /backend
  error:
    include-message: never
    include-stacktrace: never
apexpredict:
  connector:
    url: ${F1_CONNECTOR_URL:https://dacs-1-jpud.onrender.com/conector}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
    sync-interval-ms: ${SYNC_INTERVAL_MS:900000}
    initial-delay-ms: ${SYNC_INITIAL_DELAY_MS:60000}
  notifications:
    email-webhook-url: ${EMAIL_WEBHOOK_URL:}
    email-api-secret: ${EMAIL_API_SECRET:}
  security:
    issuer: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_ISSUER:https://dacs-3-u0q1.onrender.com/auth/realms/apexpredict}}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://dacs-3-u0q1.onrender.com/auth/realms/apexpredict/protocol/openid-connect/certs}
    audience: apexpredict-backend
