@if (!isAuthRoute()) {
  <app-navbar />
}
@if (!auth.available()) {
  <div class="notice error" role="alert" style="margin: 1rem auto; max-width: 1440px;">
    El inicio de sesión no está disponible temporalmente. Comprobá la conexión y recargá la página.
  </div>
}
<main id="main">
  <router-outlet />
</main>
@if (!isAuthRoute()) {
  <footer style="border-top: 1px solid var(--line); padding: 2rem 5%; text-align: center; color: var(--text-dim); font-size: 0.85rem; display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; background: rgba(9, 11, 14, 0.9);">
    <span style="font-weight: 800; letter-spacing: 0.02em;"><span style="color: var(--red, #e10600);">//</span> <span style="color: #ffffff;">APEX</span> <span style="color: var(--red, #e10600);">PREDICT</span></span>
    <span>Plataforma oficial de pronósticos de Fórmula 1.</span>
  </footer>
}
