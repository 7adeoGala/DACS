# Docker DNS: permite recrear los upstreams sin conservar su IP anterior.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name dacs2026.local;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    # Entrada de desarrollo: el interceptor eleva localhost:8080 a HTTPS.
    listen 8080 ssl;
    server_name dacs2026.local localhost;

    ssl_certificate /etc/nginx/ssl/dacs2026.local.pem;
    ssl_certificate_key /etc/nginx/ssl/dacs2026.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    server_tokens off;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # El unico proxy publico es Nginx: descartar valores enviados por el cliente.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/ssl/dacs2026.local.pem;
    proxy_ssl_server_name on;
    proxy_ssl_name dacs2026.local;

    location = /auth { return 308 /auth/$is_args$args; }
    location ^~ /auth/ {
        set $keycloak_upstream keycloak:8080;
        # Keycloak tambien usa /auth: conservar el prefijo y los parametros.
        proxy_pass http://$keycloak_upstream;
    }

    location = /api { return 308 /api/$is_args$args; }
    # "~" es obligatorio para que ^/api/(.*) sea una expresion regular.
    location ~ ^/api/(.*) {
        set $bff_upstream bff:8443;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass https://$bff_upstream;
    }

    location = /pgadmin { return 308 /pgadmin/$is_args$args; }
    location ^~ /pgadmin/ {
        # Repetir las cabeceras: proxy_set_header local anula la herencia.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header Connection "";
        set $pgadmin_upstream pgadmin:80;
        rewrite ^/pgadmin/(.*)$ /$1 break;
        proxy_pass http://$pgadmin_upstream;
        proxy_redirect off;
    }

    location = / { return 302 /apexpredict/; }
    location = /apexpredict { return 308 /apexpredict/$is_args$args; }
    location /apexpredict/ {
        try_files $uri $uri/ /apexpredict/index.html;
    }
    location / {
        return 404;
    }

    # La administracion es ahora una ruta lazy de la misma aplicacion.
    location = /admin { return 302 /apexpredict/admin; }
    location /admin/ {
        return 302 /apexpredict/admin;
    }

    # Un asset inexistente debe devolver 404 y no el index de una SPA.
    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|json)$ {
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
}

# Endpoint interno, sin puerto publicado, para la salud del contenedor.
server {
    listen 8081;
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }
    location / { return 404; }
}
