name: apexpredict

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecutar scripts/setup-env.ps1}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Falta APP_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Falta KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Falta PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Falta PGADMIN_PASSWORD}
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: '1'
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: '1'
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: 'True'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [web, data]
    healthcheck:
      test: [CMD, /venv/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Falta KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Falta KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://dacs2026.local/auth
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
    volumes:
      - ./infra/keycloak/apexpredict-realm.json:/opt/keycloak/data/import/apexpredict-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [web, data]
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\r\n\r\n\" >&3; grep -q \"200 OK\" <&3'"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  domain-service:
    build: ./backend/domain-service
    environment:
      APP_DB_PASSWORD: ${DOMAIN_DB_PASSWORD:-${APP_DB_PASSWORD}}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/apexpredict}
      DB_USER: ${DB_USER:-apexpredict}
    volumes:
      - ./infra/certs/generated/dacs2026.local.pem:/certs/local.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [web, internal, data]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9003/backend/ping]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  f1-connector:
    build: ./backend/f1-connector
    environment:
      JOLPICA_API_URL: ${JOLPICA_API_URL:-https://api.jolpi.ca/ergast/f1}
      OPENF1_API_URL: ${OPENF1_API_URL:-https://api.openf1.org/v1}
    networks: [internal]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9002/conector/ping]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  bff:
    build: ./backend/bff
    environment:
      CERT_PASSWORD: ${CERT_PASSWORD:?Falta CERT_PASSWORD}
      DOMAIN_SERVICE_URL: http://domain-service:9003/backend
      F1_CONNECTOR_URL: http://f1-connector:9002/conector
    volumes:
      - ./infra/certs/generated/dacs2026.local.p12:/certs/local.p12:ro
      - ./infra/certs/generated/dacs2026.local.pem:/certs/local.pem:ro
    depends_on:
      domain-service:
        condition: service_healthy
      f1-connector:
        condition: service_healthy
    networks: [web, internal]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /certs/local.pem, https://127.0.0.1:8443/bff/health]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
      - '127.0.0.1:8080:8080'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs/generated/dacs2026.local.pem:/etc/nginx/ssl/dacs2026.local.pem:ro
      - ./infra/certs/generated/dacs2026.local.key:/etc/nginx/ssl/dacs2026.local.key:ro
      - ./frontend/www:/usr/share/nginx/html:ro
    depends_on:
      keycloak:
        condition: service_healthy
      pgadmin:
        condition: service_healthy
      bff:
        condition: service_healthy
    networks:
      web:
        aliases: [dacs2026.local]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/health]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:

networks:
  web:
  internal:
  data:
    internal: true
