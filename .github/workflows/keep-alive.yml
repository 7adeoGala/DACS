name: Render Keep Alive

on:
  # Cron desactivado para no superar las 750 horas/mes del plan Free de Render (4 servicios x 24h = 96h/día).
  # schedule:
  #   - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch: # Permite ejecutar el ping manualmente desde la pestaña Actions de GitHub

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Servicios Render
        run: |
          echo "Pinging BFF Health..."
          curl -s -o /dev/null -w "BFF: %{http_code}\n" --max-time 45 https://dacs-2-2q62.onrender.com/bff/ping || true
          sleep 2

          echo "Pinging Domain Service Direct..."
          curl -s -o /dev/null -w "Domain Service: %{http_code}\n" --max-time 60 https://dacs-f0st.onrender.com/backend/ping || true
          sleep 2

          echo "Pinging BFF-to-Domain Chain..."
          curl -s -o /dev/null -w "BFF-to-Domain: %{http_code}\n" --max-time 60 https://dacs-2-2q62.onrender.com/bff/backendping || true
          sleep 2

          echo "Pinging F1 Connector Direct..."
          curl -s -o /dev/null -w "F1 Connector: %{http_code}\n" --max-time 60 https://dacs-1-jpud.onrender.com/conector/ping || true
          sleep 2

          echo "Pinging Keycloak Auth..."
          curl -s -o /dev/null -w "Keycloak: %{http_code}\n" --max-time 60 https://dacs-3-u0q1.onrender.com/auth/realms/apexpredict || true

